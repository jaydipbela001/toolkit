  <text x="74" y="22"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="15" font-weight="800" letter-spacing="-0.3"
        fill="#f8fafc">ToolsHub</text>

  <!-- Tagline -->
  <text x="48" y="38"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="9" font-weight="500" letter-spacing="0.5"
        fill="#9ca3af">FREE DEVELOPER TOOLS</text>
