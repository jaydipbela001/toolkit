<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow orbs -->
  <circle cx="200" cy="200" r="300" fill="#6366f1" opacity="0.06"/>
  <circle cx="1000" cy="430" r="250" fill="#ec4899" opacity="0.05"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" stroke="#1f2937" stroke-width="2" fill="none"/>

  <!-- Icon background -->
  <rect x="80" y="215" width="120" height="120" rx="28" fill="url(#accent)" opacity="0.2"/>
  <rect x="80" y="215" width="120" height="120" rx="28" stroke="url(#accent)" stroke-width="2" fill="none"/>

  <!-- Lightning bolt icon -->
  <path d="M152 232 L124 280 L142 280 L136 318 L168 268 L150 268 L160 232 Z"
        fill="url(#bolt-grad)" filter="url(#glow)"/>

  <!-- Brand name -->
  <text x="228" y="278"
        font-family="Inter, -apple-system, sans-serif"
        font-size="64" font-weight="800" letter-spacing="-2"
        fill="url(#accent)">Dev</text>
  <text x="340" y="278"
        font-family="Inter, -apple-system, sans-serif"
        font-size="64" font-weight="800" letter-spacing="-2"
        fill="#f8fafc">ToolsHub</text>

  <!-- Tagline -->
  <text x="228" y="330"
        font-family="Inter, -apple-system, sans-serif"
        font-size="24" font-weight="500" letter-spacing="1"
        fill="#9ca3af">Free · Fast · Private · Browser-Based</text>

  <!-- Tool pills -->
  <rect x="80" y="390" width="160" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="160" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">Age Calculator</text>

  <rect x="256" y="390" width="160" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="336" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">EMI Calculator</text>

  <rect x="432" y="390" width="190" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="527" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">Timezone Converter</text>

  <rect x="638" y="390" width="190" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="733" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">Password Generator</text>

  <rect x="844" y="390" width="170" height="40" rx="20" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="929" y="416" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">Code Formatter</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="18" font-weight="500"
        fill="#4b5563">devtoolshub-tools.vercel.app</text>
</svg>
