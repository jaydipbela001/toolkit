<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>DevToolsHub – Free Online Developer Tools | Age, EMI, Timezone, Password & Code Formatter</title>
    <meta name="description" content="DevToolsHub offers free, fast, browser-based tools: Age Calculator, EMI Calculator, Timezone Converter, Password Generator, Code Formatter, XML Formatter, and Diff Checker. No sign-up. No data stored. 100% private." />
    <meta name="keywords" content="age calculator, EMI calculator, timezone converter, password generator, JSON formatter, XML formatter, CSS formatter, HTML formatter, SQL formatter, diff checker, code formatter, free online tools, developer tools, devtoolshub" />
    <meta name="author" content="DevToolsHub" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://devtoolshub.com/" />

    <!-- ── Open Graph (Facebook / LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devtoolshub.com/" />
    <meta property="og:title" content="DevToolsHub – Free Online Developer Tools" />
    <meta property="og:description" content="Free browser-based tools: Age Calculator, EMI Calculator, Timezone Converter, Password Generator, Code Formatter & Diff Checker. No sign-up required." />
    <meta property="og:image" content="https://devtoolshub.com/og-image.png" />
    <meta property="og:site_name" content="DevToolsHub" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://devtoolshub.com/" />
    <meta name="twitter:title" content="DevToolsHub – Free Online Developer Tools" />
    <meta name="twitter:description" content="Free browser-based tools: Age Calculator, EMI Calculator, Timezone Converter, Password Generator, Code Formatter & Diff Checker." />
    <meta name="twitter:image" content="https://devtoolshub.com/og-image.png" />

    <!-- ── Structured Data (JSON-LD) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DevToolsHub",
      "url": "https://devtoolshub.com",
      "description": "Free, browser-based developer and productivity tools. No sign-up required.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://devtoolshub.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DevToolsHub",
      "url": "https://devtoolshub.com",
      "logo": "https://devtoolshub.com/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@devtoolshub.com",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />

    <meta name="theme-color" content="#6366f1" />
  </head>
